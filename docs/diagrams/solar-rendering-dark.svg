<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1578" viewBox="0 0 640 1578" role="img" aria-labelledby="title description">
<title id="title">A scene that protects the page.</title><desc id="description">The server renders a complete fallback with matching camera and orbits. Deferred texture loading and pre-frame preparation feed a single render pass; a cached quarter-resolution reading mask feeds that pass independently. Adaptive quality feeds back into rendering. The fallback crossfades only once the first frame is ready. Reduced motion, missing WebGL, failed textures and context loss retain the static scene; hidden tabs suspend rendering.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8BA3C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="640" height="1578" rx="24" fill="#0B1220"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="43" font-size="17" font-weight="700" fill="#4CD6FF" letter-spacing="2">SOLAR SCENE / RENDERING</text>
<text x="32" y="84" font-size="30" font-weight="700" fill="#EDF3FF">A scene that protects the page.</text>
<text x="32" y="117" font-size="20" font-weight="400" fill="#B0C0D6">Complete fallback → prepared first frame → adaptive rendering</text>
<rect x="72" y="150" width="536" height="190" rx="18" fill="#0E192B" stroke="#354961" stroke-width="1.5"/>
<text x="94" y="184" font-size="17" font-weight="650" fill="#B0C0D6" letter-spacing="1">ALWAYS AVAILABLE · SERVER RENDERED</text>
<rect x="96" y="208" width="488" height="108" rx="18" fill="#111D2E" stroke="#354961" stroke-width="1.5"/>
<rect x="96" y="228" width="4" height="68" rx="2" fill="#4CD6FF"/>
<text x="118" y="242" font-size="25" font-weight="650" fill="#EDF3FF">Complete static scene</text>
<text x="118" y="272" font-size="20" font-weight="400" fill="#B0C0D6">Matching camera and orbital positions</text>
<text x="118" y="298" font-size="20" font-weight="400" fill="#B0C0D6">CSS terminators · Content remains readable</text>
<text x="545" y="241" font-size="16" font-weight="650" fill="#4CD6FF">01</text>
<rect x="72" y="386" width="536" height="956" rx="18" fill="#0E192B" stroke="#354961" stroke-width="1.5"/>
<text x="94" y="420" font-size="17" font-weight="650" fill="#B0C0D6" letter-spacing="1">DEFERRED BROWSER ENGINE · THREE.JS</text>
<rect x="96" y="444" width="488" height="108" rx="18" fill="#111D2E" stroke="#354961" stroke-width="1.5"/>
<rect x="96" y="464" width="4" height="68" rx="2" fill="#4CD6FF"/>
<text x="118" y="478" font-size="25" font-weight="650" fill="#EDF3FF">Load only the detail needed</text>
<text x="118" y="508" font-size="20" font-weight="400" fill="#B0C0D6">Size-matched texture variants</text>
<text x="118" y="534" font-size="20" font-weight="400" fill="#B0C0D6">Off-main-thread image decode</text>
<text x="545" y="477" font-size="16" font-weight="650" fill="#4CD6FF">02</text>
<path d="M 340 552 V 586" fill="none" stroke="#8BA3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="96" y="586" width="488" height="108" rx="18" fill="#111D2E" stroke="#354961" stroke-width="1.5"/>
<rect x="96" y="606" width="4" height="68" rx="2" fill="#4CD6FF"/>
