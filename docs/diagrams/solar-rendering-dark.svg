<text x="118" y="1032" font-size="20" font-weight="400" fill="#B0C0D6">Crossfade with the aligned static scene</text>
<text x="545" y="949" font-size="16" font-weight="650" fill="#4CD6FF">05</text>
<path d="M 584 262 H 624 V 988 H 584" fill="none" stroke="#8BA3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="96" y="1210" width="488" height="108" rx="18" fill="#111D2E" stroke="#354961" stroke-width="1.5"/>
<rect x="96" y="1230" width="4" height="68" rx="2" fill="#4CD6FF"/>
<text x="118" y="1244" font-size="25" font-weight="650" fill="#EDF3FF">Adapt without quality thrashing</text>
<text x="118" y="1274" font-size="20" font-weight="400" fill="#B0C0D6">Calibrated display refresh · Hysteresis</text>
