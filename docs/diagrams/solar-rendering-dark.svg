<path d="M 340 1060 V 1210" fill="none" stroke="#8BA3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 96 1264 H 24 V 1036 H 96" fill="none" stroke="#8BA3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="96" y="1365" font-size="17" font-weight="650" fill="#4CD6FF" letter-spacing="1">FALLBACK IS A COMPLETE SCENE</text>
<text x="96" y="1398" font-size="20" font-weight="400" fill="#B0C0D6">Reduced motion · Missing WebGL</text>
<text x="96" y="1427" font-size="20" font-weight="400" fill="#B0C0D6">Texture failure · Context loss</text>
<path d="M 34 1480 H 70" fill="none" stroke="#8BA3C4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="84" y="1487" font-size="19" font-weight="400" fill="#B0C0D6">Flow / dependency</text>
