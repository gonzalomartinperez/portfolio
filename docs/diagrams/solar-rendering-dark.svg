<text x="118" y="650" font-size="20" font-weight="400" fill="#B0C0D6">Upload maps · Compile shader programs</text>
<text x="118" y="676" font-size="20" font-weight="400" fill="#B0C0D6">Place every body before the first frame</text>
<text x="545" y="619" font-size="16" font-weight="650" fill="#4CD6FF">03</text>
