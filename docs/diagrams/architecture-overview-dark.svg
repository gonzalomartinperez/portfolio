<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1508" viewBox="0 0 640 1508" role="img" aria-labelledby="title description">
<title id="title">One portfolio. Clear boundaries.</title><desc id="description">Reviewed content feeds the App Router, persistent shell and server page composition. The App Router also produces a deployment for managed Hostinger hosting. The shell can lazily start one assistant controller only when the build gate is enabled; it uses credentialed HTTPS with REST, SSE, sessions and CSRF against a separate API. The portfolio has no application database or provider key.</desc>
