version: 2
multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: develop
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: ["dependencies"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      # Hostinger runs Node 24; @types/node stays on the 24 line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tools/api-contract
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: ["dependencies"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      # The generator consumes the TS5 compiler API; review compiler majors with its upgrade.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: ["dependencies"]
    cooldown:
      default-days: 7
