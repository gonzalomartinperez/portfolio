version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
