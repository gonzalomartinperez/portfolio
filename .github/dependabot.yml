# Weekly single dependency PR (ecosystem standard section 5), from the engineering-standards
# release-flow template (v1.0.0). Group-level limit, commit-message and labels; semver cooldowns
# only on npm. Checked by standards-drift (dependabot-policy) and the dependency-policy test.
version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: develop
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      # Hostinger runs Node 24; @types/node stays on the 24 line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tools/api-contract
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      # The generator consumes the TS5 compiler API; review compiler majors with its upgrade.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
