name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality (development)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ASSISTANT_ENABLED: "true"
      ANALYTICS_ENABLED: "true"
      ANALYTICS_INGEST_URL: "https://127.0.0.1:3160/api/v1/analytics/events"
      NPM_CONFIG_CACHE: /tmp/portfolio-npm-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/api-contract/package-lock.json
      - name: Install checksum-verified secret scanner
        run: |
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/portfolio-gitleaks.XXXXXX")"
          trap 'rm -f "$scanner_dir/archive.tar.gz"' EXIT
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/archive.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Reject secrets in tracked files and available history
        run: npm run test:secrets
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Regenerate the committed assistant contract with frozen tooling
        run: npm run contract:generate
      - name: Audit both locked dependency graphs
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix tooling/api-contract --audit-level=moderate
      - name: Reject generated contract drift
        run: git diff --exit-code -- src/contracts
      - name: Check architecture, repository, lint, types, and production build
        run: npm run check
      - name: Verify server-rendered routes
        run: npm run test:rendered
      - name: Plan and verify complete duration-balanced browser coverage
        run: node scripts/browser-ci-planner.mjs
      - name: Remove ephemeral framework keys from the CI transfer
        run: node scripts/ci-build-artifact.mjs prepare
      - name: Reject secrets in the build artifact before upload
        run: npm run test:secrets:artifacts
      - name: Package the verified production build
        run: tar --exclude=.next/cache -cf - .next .artifacts/ci | gzip -1 > /tmp/portfolio-production-build.tar.gz
      - name: Share the build with isolated browser runners
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build
          path: /tmp/portfolio-production-build.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code

  browser:
    name: Browser verification (${{ matrix.shard }}/8)
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --init --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ASSISTANT_ENABLED: "true"
      ANALYTICS_ENABLED: "true"
      ANALYTICS_INGEST_URL: "https://127.0.0.1:3160/api/v1/analytics/events"
      NPM_CONFIG_CACHE: /tmp/portfolio-npm-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/api-contract/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download this run's verified production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build
          path: /tmp/portfolio-build
      - name: Restore the production build
        run: tar -xzf /tmp/portfolio-build/portfolio-production-build.tar.gz
      - name: Restore runner-local ephemeral framework keys
        run: node scripts/ci-build-artifact.mjs restore
      - name: Align the ephemeral browser session and checkout
        run: |
          chown -- "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
      - name: Verify every preinstalled browser runtime
        run: node scripts/check-browser-runtime.mjs
      - name: Verify interactions and accessibility on an isolated runner
        run: npm run test:browser -- --test-list=.artifacts/ci/shards/${{ matrix.shard }}.txt
      - name: Retain browser verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification-${{ matrix.shard }}
          path: |
            .artifacts/playwright/report
            .artifacts/playwright/results
            .artifacts/playwright/timing-report.json
            .artifacts/ci/shards/plan.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code

  legacy-linux:
    name: Compatibility (Hostinger / GLIBC 2.28)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: rockylinux:8@sha256:2d05a9266523bbf24f33ebc3a9832e4d5fd74b973c220f2204ca802286aa275d
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ASSISTANT_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
    steps:
      - name: Install container prerequisites
        run: dnf --setopt=timeout=20 --setopt=minrate=500000 --setopt=retries=3 install -y git tar gzip xz
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up observed hosting runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.6.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate the container checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
      - name: Verify compatibility baseline
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Require automatic SWC WebAssembly fallback
        run: node -e 'require("next/dist/build/swc").loadBindings().then(b => { if (!b.isWasm) throw new Error("Expected SWC WASM on GLIBC 2.28"); })'
      - name: Build and validate TypeScript with WebAssembly
        run: npm run build
      - name: Smoke-test the production server
        run: npm run test:smoke
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code

  check:
    name: Quality checks
    if: always()
    needs: [validate, browser, legacy-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all runtime and compatibility checks
        env:
          RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          LEGACY_RESULT: ${{ needs.legacy-linux.result }}
        run: test "$RESULT" = success && test "$BROWSER_RESULT" = success && test "$LEGACY_RESULT" = success
