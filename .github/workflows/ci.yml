name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: development
            node-file: .nvmrc
          - runtime: hostinger
            node-version: 24.6.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ matrix.node-file }}
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Report toolchain versions
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run build
      - name: Smoke-test the production server
        run: npm run test:smoke
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code

  check:
    name: Quality checks
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both runtime checks
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
